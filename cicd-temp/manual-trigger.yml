name: PR Manually Trigger for Java Application
run-name: ${{ github.actor }} runned this pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - uat
        - prod
jobs:
  logic-cicd-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source code
        uses: actions/checkout@v5
      - uses: actions/setup-java@v5 # setup docker
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true
      - name: Maven build source code
        run:  mvn -B package 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: huynguyen2025
          password: 
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags:  huynguyen2025/logic:v1.0.0 
      - run: echo "Store and Push artifact"
      - run: echo "Deploying on ${{ inputs.environment }}"\